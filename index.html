<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genshin Lore Mongolian — Тоглоомын ертөнц, нууц түүх, домог</title>
<meta name="description" content="Genshin Impact-ийн Teyvat ертөнцийн lore, дүрүүд, гайд, мэдээ — монгол хэлээр.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Noto+Serif:wght@400;600&display=swap">
<style>
:root{
  /* Арын зургийн линкийг энд тавина: url('https://share.google/PS9iTijgW9wIJXL06') */
  --hero-img: none;
  --gold:#f5d98a; --gold-2:#d9a940; --ivory:#fffaf0;
  --ff-title:'Cinzel','Noto Serif',serif;
  --ff-text:'Noto Serif','Cormorant Garamond',serif;
  --ff-quote:'Cormorant Garamond','Noto Serif',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ff-text);color:var(--ivory);background:#0b1f5c;overflow-x:hidden}
a{color:inherit;text-decoration:none}

.hero{
  position:relative;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;
  background:
    var(--hero-img) center/cover no-repeat,
    radial-gradient(ellipse at 45% 30%,rgba(255,255,255,.55),transparent 35%),
    radial-gradient(ellipse at 30% 75%,#7fd16a 0,#4ea84a 18%,transparent 40%),
    radial-gradient(ellipse at 90% 85%,#f6a8cf 0,transparent 25%),
    linear-gradient(180deg,#1f5fe0 0%,#4a95f0 45%,#a6d3ff 75%,#6bbf6a 100%);
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(8,25,80,.15),transparent 40%,rgba(8,25,80,.35) 100%),
             linear-gradient(0deg,rgba(8,25,80,.45),transparent 30%);
}
.hero>*{position:relative;z-index:2}

/* NAV */
.nav{display:flex;align-items:center;gap:24px;padding:18px 3vw}
.logo{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.logo svg{width:56px;height:56px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.logo b{display:block;font:900 clamp(18px,2vw,28px)/1 var(--ff-title);letter-spacing:.04em;color:#fff;text-shadow:0 2px 8px rgba(0,20,90,.6)}
.logo small{display:block;margin-top:4px;font:italic 500 14px var(--ff-quote);color:var(--gold);text-align:center}
.menu{display:flex;gap:6px;margin:0 auto;list-style:none}
.menu a{display:flex;align-items:center;gap:8px;padding:10px 18px;font-size:16px;font-weight:600;border-radius:30px;
  text-shadow:0 1px 6px rgba(0,20,90,.7);transition:.25s;position:relative}
.menu a svg{width:22px;height:22px;fill:currentColor}
.menu a:hover,.menu a.active{color:var(--gold)}
.menu a.active::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.search{display:flex;align-items:center;gap:10px;width:260px;padding:10px 18px;border-radius:30px;
  background:rgba(10,30,100,.55);border:1px solid rgba(245,217,138,.35);backdrop-filter:blur(6px)}
.search svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:2.4;flex:0 0 auto}
.search input{all:unset;width:100%;color:#fff;font-size:16px}
.search input::placeholder{color:#cfe0ff}
.burger{display:none;background:none;border:0;color:#fff;font-size:30px;cursor:pointer;margin-left:auto}

/* TITLE */
.content{flex:1;display:flex;align-items:center;justify-content:flex-end;padding:2vh 5vw}
.title-box{width:min(640px,100%);text-align:center}
.sparkle{width:70px;height:36px;margin:0 auto -6px;display:block;fill:var(--gold);filter:drop-shadow(0 0 8px #fff)}
.title-box h1{font-family:var(--ff-title);font-weight:900;line-height:.95;text-transform:uppercase;
  background:linear-gradient(180deg,#fff 0%,#fff 45%,#ffe9a8 60%,#e0a93e 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 10px rgba(0,20,90,.65))}
.title-box h1 span{display:block}
.t1{font-size:clamp(52px,8vw,120px)}
.t2{font-size:clamp(34px,5.4vw,80px);margin-top:4px}
.subtitle{display:flex;align-items:center;gap:14px;margin:18px 0 8px;font-size:clamp(16px,1.7vw,24px);font-weight:600;
  color:#fff3c9;text-shadow:0 2px 8px rgba(0,20,90,.8)}
.subtitle::before,.subtitle::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.subtitle::after{transform:scaleX(-1)}
.diamond{width:18px;height:18px;fill:var(--gold);flex:0 0 auto}
.quote{margin-top:22px;font:italic 600 clamp(18px,2vw,28px)/1.35 var(--ff-quote);color:#fff;text-shadow:0 2px 10px rgba(0,20,90,.8)}
.cta{display:inline-block;margin-top:26px;padding:12px 34px;border-radius:40px;font:700 16px var(--ff-title);letter-spacing:.06em;color:#3a2a00;
  background:linear-gradient(180deg,#fff0b8,#e0a93e);box-shadow:0 6px 20px rgba(0,20,90,.45),inset 0 1px 0 #fff;transition:.25s}
.cta:hover{transform:translateY(-3px)}

/* BOTTOM */
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:0 3vw 28px}
.badge{padding:12px 34px;border-radius:6px;font:italic 600 clamp(15px,1.6vw,22px) var(--ff-quote);color:#fff;
  background:rgba(8,25,90,.7);border:1px solid var(--gold-2);box-shadow:0 0 0 3px rgba(8,25,90,.5),0 0 0 4px rgba(245,217,138,.5)}
.badge i{color:var(--gold);font-style:normal;margin:0 8px}
.quick{display:flex;gap:6px;list-style:none}
.quick li+li{border-left:1px solid rgba(245,217,138,.3)}
.quick a{display:flex;flex-direction:column;align-items:center;gap:10px;width:clamp(86px,9.5vw,150px);padding:0 6px;
  font-weight:700;font-size:clamp(13px,1.3vw,19px);text-shadow:0 2px 6px rgba(0,20,90,.9);transition:.25s}
.quick a:hover{transform:translateY(-6px);color:var(--gold)}
.gem{position:relative;width:clamp(58px,6vw,88px);aspect-ratio:1;display:grid;place-items:center}
.gem::before{content:"";position:absolute;inset:12%;transform:rotate(45deg);
  background:linear-gradient(135deg,rgba(20,45,130,.9),rgba(40,80,190,.8));border:2px solid var(--gold);
  box-shadow:0 0 0 4px rgba(245,217,138,.18),0 0 16px rgba(245,217,138,.55)}
.gem svg{position:relative;width:46%;height:46%;fill:var(--gold)}

/* RESPONSIVE */
@media(max-width:1000px){
  .search{width:190px}
  .menu a{padding:8px 10px;font-size:14px}
  .menu a svg{display:none}
}
@media(max-width:760px){
  .burger{display:block}
  .menu{display:none;position:absolute;top:84px;left:3vw;right:3vw;flex-direction:column;padding:12px;border-radius:18px;
    background:rgba(8,25,90,.92);border:1px solid rgba(245,217,138,.4)}
  .menu.open{display:flex}
  .menu a svg{display:block}
  .search{display:none}
  .logo svg{width:44px;height:44px}
  .content{justify-content:center;padding-top:30px}
  .bottom{flex-direction:column;align-items:center}
  .quick{justify-content:center}
}
</style>
</head>
<body>

<header class="hero">
  <nav class="nav">
    <a href="/" class="logo" aria-label="Games Lore Mongolian">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="40" fill="none" stroke="#f5d98a" stroke-width="2" opacity=".6"/>
        <path d="M50 2 58 42 98 50 58 58 50 98 42 58 2 50 42 42Z" fill="#f5d98a"/>
        <path d="M50 18 55 45 82 50 55 55 50 82 45 55 18 50 45 45Z" fill="#fff3c9"/>
        <path d="M18 18 44 44M82 18 56 44M18 82 44 56M82 82 56 56" stroke="#d9a940" stroke-width="3"/>
      </svg>
      <span><b>Games Lore<br>Mongolian</b><small>Genshin Impact</small></span>
    </a>

    <ul class="menu" id="menu">
      <li><a href="/" class="active"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg>Нүүр</a></li>
      <li><a href="/search/label/Characters"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><circle cx="17" cy="8" r="3"/><path d="M9 13c-3 0-7 1.5-7 4.5V20h14v-2.5C16 14.5 12 13 9 13Z"/></svg>Дүрүүд</a></li>
      <li><a href="/search/label/Guide"><svg viewBox="0 0 24 24"><path d="M12 6C10 4.5 7 4 3 4v14c4 0 7 .5 9 2 2-1.500 5-2 9-2V4c-4 0-7 .5-9 2Z"/></svg>Гайд</a></li>
      <li><a href="/search/label/News"><svg viewBox="0 0 24 24"><path d="M5 3h14v4H5zM6 8h12v9a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4Z"/></svg>Мэдээ</a></li>
      <li><a href="/search/label/Lore" aria-label="Lore"><svg viewBox="0 0 24 24"><path d="M6 3h13v3H6a1 1 0 0 0 0 2h13v11a2 2 0 0 1-2 2H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z"/></svg></a></li>
    </ul>

    <form class="search" action="/search" method="get" role="search">
      <svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg>
      <input type="search" name="q" placeholder="Хайх..." aria-label="Хайх">
    </form>
    <button class="burger" aria-label="Цэс" onclick="document.getElementById('menu').classList.toggle('open')">☰</button>
  </nav>

  <main class="content">
    <div class="title-box">
      <svg class="sparkle" viewBox="0 0 70 36" aria-hidden="true"><path d="M35 0c2 10 6 14 12 16-6 2-10 6-12 16-2-10-6-14-12-16 6-2 10-6 12-16Z"/></svg>
      <h1><span class="t1">Genshin</span><span class="t2">Lore Mongolian</span></h1>

      <div class="subtitle">
        <svg class="diamond" viewBox="0 0 20 20"><path d="M10 0c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10Z"/></svg>
        Тоглоомын ертөнц, нууц түүх, домог
        <svg class="diamond" viewBox="0 0 20 20"><path d="M10 0c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10Z"/></svg>
      </div>

      <p class="quote">“Teyvat-ийн түүхийг<br>хамтдаа нэцгээе...”</p>
      <a href="/search/label/Lore" class="cta">ЭХЛЭХ</a>
    </div>
  </main>

  <div class="bottom">
    <div class="badge">Genshin Impact<i>•</i>Teyvat<i>•</i>Endless Adventure</div>

    <ul class="quick">
      <li><a href="/search/label/Characters"><span class="gem"><svg viewBox="0 0 24 24"><path d="M12 1l2.5 8.5L23 12l-8.5 2.5L12 23l-2.500-8.5L1 12l8.500-2.500z"/></svg></span>Дүрүүд</a></li>
      <li><a href="/search/label/Lore"><span class="gem"><svg viewBox="0 0 24 24"><path d="M12 6C10 4.500 7 4 3 4v14c4 0 7 .5 9 2 2-1.500 5-2 9-2V4c-4 0-7 .5-9 2Z"/></svg></span>Lore &amp; Түүх</a></li>
      <li><a href="/search/label/Guide"><span class="gem"><svg viewBox="0 0 24 24"><path d="M5 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5z"/></svg></span>Гайд</a></li>
      <li><a href="/search/label/Updates"><span class="gem"><svg viewBox="0 0 24 24"><path d="M3 8h18v4H3zM4 13h16v8H4zM11 8h2v13h-2z"/></svg></span>Шинэчлэлт</a></li>
    </ul>
  </div>
</header>

</body>
</html>
