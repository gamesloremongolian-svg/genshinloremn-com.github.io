<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games Lore Mongolian - Genshin Impact</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-image: linear-gradient(rgba(11, 15, 25, 0.4), rgba(11, 15, 25, 0.7)), url('images/background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(11, 15, 25, 0.6);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(216, 183, 122, 0.3);
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .logo-icon {
      font-size: 28px;
      color: #d8b77a;
    }
    .logo-text h2 {
      font-size: 20px;
      color: #ffffff;
      letter-spacing: 1px;
    }
    .logo-text span {
      font-size: 12px;
      color: #d8b77a;
      letter-spacing: 2px;
    }

    nav {
      display: flex;
      gap: 30px;
      align-items: center;
    }
    nav a {
      color: #cfd3dc;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: color 0.3s;
    }
    nav a:hover, nav a.active {
      color: #d8b77a;
    }

    .search-box {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(216, 183, 122, 0.4);
      border-radius: 20px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      width: 220px;
    }
    .search-box input {
      background: transparent;
      border: none;
      color: #fff;
      outline: none;
      width: 100%;
      font-size: 14px;
    }
    .search-box input::placeholder {
      color: #a0a6bd;
    }

    .hero-container {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 60px 80px;
      flex-grow: 1;
    }

    .hero-content {
      max-width: 550px;
      text-align: right;
    }

    .hero-content h1 {
      font-size: 3.5rem;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 15px;
      background: linear-gradient(to bottom, #ffffff, #d8b77a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: 1.2rem;
      color: #d8b77a;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    .quote-box {
      font-style: italic;
      color: #cfd3dc;
      font-size: 1.1rem;
      margin-bottom: 40px;
      text-shadow: 0 1px 5px rgba(0,0,0,0.8);
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      padding: 0 80px 30px 80px;
    }

    .action-card {
      background: rgba(19, 24, 38, 0.7);
      border: 1px solid rgba(216, 183, 122, 0.4);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.3s, background 0.3s, border-color 0.3s;
      text-decoration: none;
      color: white;
    }

    .action-card:hover {
      transform: translateY(-5px);
      background: rgba(28, 35, 56, 0.85);
      border-color: #d8b77a;
    }

    .action-card .icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .action-card h3 {
      font-size: 16px;
      color: #d8b77a;
    }

    .footer-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      background: rgba(11, 15, 25, 0.8);
      border-top: 1px solid rgba(216, 183, 122, 0.2);
      font-size: 13px;
      color: #a0a6bd;
    }

    @media (max-width: 900px) {
      .hero-container {
        justify-content: center;
        text-align: center;
        padding: 30px 20px;
      }
      .hero-content {
        text-align: center;
      }
      .action-grid {
        grid-template-columns: repeat(2, 1fr);
        padding: 0 20px 20px 20px;
      }
      header {
        flex-direction: column;
        gap: 15px;
        padding: 15px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <div class="logo-icon">✦</div>
      <div class="logo-text">
        <h2>GAMES LORE MONGOLIAN</h2>
        <span>GENSHIN IMPACT</span>
      </div>
    </div>
    <nav>
      <a href="index.html" class="active">Нүүр</a>
      <a href="characters.html">Дүрүүд</a>
      <a href="#">Гайд</a>
      <a href="#">Мэдээ</a>
    </nav>
    <div class="search-box">
      <input type="text" placeholder="Хайх...">
    </div>
  </header>

  <section class="hero-container">
    <div class="hero-content">
      <h1>GENSHIN LORE MONGOLIAN</h1>
      <p class="hero-subtitle">✦ Тоглоомын ертөнц, нууц түүх, домог ✦</p>
      <div class="quote-box">
        “Teyvat-ийн түүхийг хамтдаа нээцгээ...”
      </div>
    </div>
  </section>

  <div class="action-grid">
    <a href="characters.html" class="action-card">
      <div class="icon">✦</div>
      <h3>Дүрүүд</h3>
    </a>
    <a href="#" class="action-card">
      <div class="icon">📖</div>
      <h3>Lore & Түүх</h3>
    </a>
    <a href="#" class="action-card">
      <div class="icon">📜</div>
      <h3>Гайд</h3>
    </a>
    <a href="#" class="action-card">
      <div class="icon">🎁</div>
      <h3>Шинэчлэлт</h3>
    </a>
  </div>

  <footer class="footer-strip">
    <div>Genshin Impact • Teyvat • Endless Adventure</div>
    <div>&copy; 2026 Games Lore Mongolian</div>
  </footer>

</body>
</html>
