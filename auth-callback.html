<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101522">
<title>Нэвтрэлт шалгаж байна — Games Lore MN</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101522;color:#f4f0e8;font-family:Arial,sans-serif;padding:24px}
main{width:min(440px,100%);padding:28px;border:1px solid #46536a;border-radius:16px;background:#1a2639}
h1{color:#e9bd68;font-size:23px}p{line-height:1.6;color:#aab3c4}a{color:#75d9e8}
</style>
</head>
<body><main><h1>Нэвтрэлтийг баталгаажуулж байна…</h1><p id="status">Түр хүлээнэ үү.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://zyocifqdpbgwlgwtrgnq.supabase.co";
const SUPABASE_KEY="sb_publishable_-VovpqoGFuRIi5yle5SYMw_iwMDpETf";
const statusEl=document.getElementById("status");
(async()=>{
 try{
  if(!window.supabase?.createClient)throw new Error("Supabase сан ачаалагдсангүй. Хуудсыг дахин ачаална уу.");
  const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{flowType:"pkce",detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
  const url=new URL(location.href);
  const params=new URLSearchParams(url.hash.replace(/^#/,""));
  const oauthError=url.searchParams.get("error_description")||url.searchParams.get("error")||params.get("error_description")||params.get("error");
  if(oauthError)throw new Error(decodeURIComponent(oauthError.replace(/\\+/g," ")));
  const code=url.searchParams.get("code");
  if(code){
   const {error}=await client.auth.exchangeCodeForSession(code);
   if(error)throw error;
  }else if(params.get("access_token")&&params.get("refresh_token")){
   const {error}=await client.auth.setSession({access_token:params.get("access_token"),refresh_token:params.get("refresh_token")});
   if(error)throw error;
  }
  const {data,error}=await client.auth.getSession();
  if(error)throw error;
  if(!data.session)throw new Error("Session үүссэнгүй. Энэ нь ихэвчлэн PKCE code verifier буцаах үед хадгалагдаагүйг илтгэнэ. Нэвтрэлтийг эхлүүлсэн ижил Chrome таб дээр дахин оролдоно уу.");
  statusEl.textContent="Амжилттай нэвтэрлээ. Wiki руу шилжүүлж байна…";
  location.replace("wiki.html");
 }catch(e){
  statusEl.textContent="Нэвтрэлтийн алдаа: "+(e.message||"Дахин оролдоно уу.")+" ";
  const a=document.createElement("a");a.href="auth.html";a.textContent="Нэвтрэх хуудас руу буцах";statusEl.appendChild(a);
 }
})();</script></body></html>
