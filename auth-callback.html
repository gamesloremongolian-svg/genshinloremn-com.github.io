<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101522">
  <meta name="description" content="Games Lore MN нэвтрэлтийг баталгаажуулах хуудас.">
  <title>Нэвтрэлт шалгаж байна — Games Lore MN</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #101522;
      color: #f4f0e8;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(440px, 100%);
      padding: 28px;
      border: 1px solid #46536a;
      border-radius: 16px;
      background: #1a2639;
    }
    h1 { color: #e9bd68; font-size: 23px; }
    p { color: #aab3c4; line-height: 1.6; overflow-wrap: anywhere; }
    a { color: #75d9e8; }
  </style>
  <link rel="stylesheet" href="assets/css/site-polish.css">
</head>
<body>
  <main>
    <h1>Нэвтрэлтийг баталгаажуулж байна…</h1>
    <p id="status" role="status" aria-live="polite">Түр хүлээнэ үү.</p>
  </main>

  <!-- Supabase JavaScript v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    'use strict';

    // Эдгээр нь browser-д ашиглах public тохиргоо. Secret/service_role key бүү оруулаарай.
    const SUPABASE_URL = 'https://zyocifqdpbgwlgwtrgnq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_-VovpqoGFuRIi5yle5SYMw_iwMDpETf';

    const statusEl = document.getElementById('status');

    function showError(message) {
      statusEl.textContent = 'Нэвтрэлтийн алдаа: ' + message + ' ';
      const link = document.createElement('a');
      link.href = 'auth.html';
      link.textContent = 'Нэвтрэх хуудас руу буцах';
      statusEl.appendChild(link);
    }

    (async function completeSignIn() {
      try {
        if (!window.supabase || typeof window.supabase.createClient !== 'function') {
          throw new Error('Supabase сан ачаалагдсангүй. Интернэт холболтоо шалгаад дахин оролдоно уу.');
        }

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
          auth: {
            flowType: 'pkce',
            detectSessionInUrl: false,
            persistSession: true,
            autoRefreshToken: true
          }
        });

        const callbackUrl = new URL(window.location.href);
        const hashParams = new URLSearchParams(callbackUrl.hash.slice(1));

        // URLSearchParams утгуудыг өөрөө decode хийдэг.
        const authError =
          callbackUrl.searchParams.get('error_description') ||
          callbackUrl.searchParams.get('error') ||
          hashParams.get('error_description') ||
          hashParams.get('error');

        if (authError) {
          throw new Error(authError);
        }

        const code = callbackUrl.searchParams.get('code');
        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token');

        if (code) {
          const { error } = await supabase.auth.exchangeCodeForSession(code);
          if (error) throw error;
        } else if (accessToken && refreshToken) {
          // Хуучин implicit-flow холбоос ирсэн тохиолдлын нийцтэй байдал.
          const { error } = await supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });
          if (error) throw error;
        }

        const { data, error } = await supabase.auth.getSession();
        if (error) throw error;

        if (!data || !data.session) {
          throw new Error('Session үүссэнгүй. Нэвтрэх хуудсаас дахин оролдоно уу.');
        }

        // Нэвтрэлтийн code/token-ийг хаягнаас арилгана.
        window.history.replaceState(null, '', window.location.pathname);

        statusEl.textContent = 'Амжилттай нэвтэрлээ. Wiki руу шилжүүлж байна…';
        window.location.replace(new URL('wiki.html', window.location.href).href);
      } catch (error) {
        const message = error && error.message
          ? error.message
          : 'Тодорхойгүй алдаа гарлаа. Дахин оролдоно уу.';
        showError(message);
      }
    })();
  </script>
</body>
</html>
