<!doctype html>
<html lang="mn"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eaf8f8"><title>Дүрийн мэдээлэл | Games Lore MN</title>
<style>
:root{--ink:#17212b;--muted:#5c6a75;--line:#dce9ed;--gold:#f4b936}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(145deg,#f9fcfc,#e9f8f7 52%,#e4effb);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}.topbar{height:60px;position:sticky;top:0;z-index:9;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100% - 1060px)/2));background:#ffffffdf;backdrop-filter:blur(15px);border-bottom:1px solid #dbe8ec}
.brand{font-size:14px;font-weight:900;letter-spacing:1px}.brand span{color:#50a77d}.back{font-size:13px;color:#477e91;font-weight:700}
main{width:min(1060px,calc(100% - 30px));margin:24px auto 60px}.loading,.error{padding:70px 20px;text-align:center;color:#63727d}
.profile{overflow:hidden;border-radius:25px;background:#ffffffb8;border:1px solid white;box-shadow:0 20px 65px #4b83901c}
.hero{height:clamp(290px,42vw,430px);position:relative;display:flex;justify-content:center;align-items:flex-end;overflow:hidden;background:linear-gradient(135deg,#e3f8f2,#a9d9e9 56%,#d5e4f9)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 28%,#ffffff99,transparent 43%),linear-gradient(0deg,#244c5c26,transparent 60%)}
.hero-art{position:relative;z-index:1;width:min(70%,500px);height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 14px 22px #23495c30)}
.hero-mark{position:absolute;inset:0;display:grid;place-items:center;font-size:150px;font-weight:900;color:#ffffff55}
.hero-caption{position:absolute;z-index:2;top:20px;left:24px;font-size:10px;letter-spacing:2px;color:#528795;font-weight:800}
.profile-card{position:relative;z-index:2;width:min(760px,calc(100% - 38px));margin:-72px auto 0;padding:23px 26px;background:#fffffff5;border:1px solid white;border-radius:19px;box-shadow:0 15px 42px #315c6e20}
.profile-head{display:flex;justify-content:space-between;gap:12px}.kicker{font-size:10px;letter-spacing:2px;color:#65a7a9;font-weight:800}
h1{font: bold clamp(32px,5vw,44px)/1.05 Georgia,serif;margin:8px 0 0}.stars{white-space:nowrap;color:var(--gold);font-size:20px;padding-top:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:20px}
.stat-label{font-size:10px;color:#7b8991;margin-bottom:5px}.stat-value{font-size:13px;font-weight:800}.stat-value b{margin-right:5px}
.content{width:min(760px,calc(100% - 42px));margin:24px auto 0;padding-bottom:34px}
.content-section{padding:19px 0;border-bottom:1px solid var(--line)}.content-section:last-child{border:0}
.content-section h2{font: bold 21px Georgia,serif;margin:0 0 9px}.content-section p{font-size:13px;line-height:1.85;color:#566571;margin:0;white-space:pre-line}
.build-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.build-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #e1ecef;border-radius:13px;background:#f9fcfc}
.build-icon{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(140deg,#e4f5f0,#e4effb);font-size:21px}
.build-item strong{display:block;font-size:12px}.build-item small{display:block;color:#78868f;font-size:11px;margin-top:4px}
.note{font-size:11px!important;color:#84929a!important;margin-top:10px!important}
footer{text-align:center;color:#84919a;font-size:11px;padding:20px}
@media(max-width:640px){.topbar{height:55px;padding:0 13px}main{width:calc(100% - 16px);margin:10px auto 45px}.hero{height:340px}.hero-art{width:92%}.profile-card{width:calc(100% - 20px);margin:-60px auto 0;padding:18px 16px;border-radius:16px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 10px;margin-top:16px}.content{width:calc(100% - 36px);margin-top:17px}.content-section{padding:16px 0}.build-grid{grid-template-columns:1fr}.stars{font-size:17px}}
</style></head>
<body>
<header class="topbar"><a class="brand" href="./index.html">GAMES <span>LORE MN</span></a><a class="back" href="./genshin.html#characters">← Дүрүүдийн сан</a></header>
<main><div id="profile" class="loading">Дүрийн мэдээлэл ачаалж байна…</div></main>
<footer>© 2026 Games Lore MN · Фэнүүдийн бүтээсэн архив</footer>
<script>
(()=> {
const root=document.getElementById('profile');
const wanted=new URLSearchParams(location.search).get('id');
const slug=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const elements={Anemo:['Салхи','🌪️'],Geo:['Газар','🪨'],Electro:['Цахилгаан','⚡'],Dendro:['Ургамал','🌿'],Hydro:['Ус','💧'],Pyro:['Гал','🔥'],Cryo:['Мөс','❄️']};
const weapons={Sword:'Нэг гар сэлэм',Claymore:'Хоёр гар сэлэм',Polearm:'Жад',Bow:'Нум',Catalyst:'Катализатор'};
const roles={xiao:'Үндсэн DPS',chongyun:'Sub DPS',xingqiu:'Support',albedo:'Sub DPS',alhaitham:'Үндсэн DPS',arlecchino:'Үндсэн DPS',furina:'Support',nahida:'Support / Sub DPS',neuvillette:'Үндсэн DPS',zhongli:'Shield Support'};
const builds={
xiao:['Primordial Jade Winged-Spear','Vermillion Hereafter','CRIT Rate'],
chongyun:['Skyward Pride','Noblesse Oblige','Energy Recharge'],
xingqiu:['Sacrificial Sword','Emblem of Severed Fate','Energy Recharge'],
albedo:['Cinnabar Spindle','Husk of Opulent Dreams','DEF%'],
alhaitham:['Light of Foliar Incision','Gilded Dreams','CRIT DMG'],
furina:['Splendor of Tranquil Waters','Golden Troupe','CRIT DMG'],
nahida:['A Thousand Floating Dreams','Deepwood Memories','Elemental Mastery'],
neuvillette:['Tome of the Eternal Flow','Marechaussee Hunter','CRIT DMG'],
zhongli:['Staff of Homa','Tenacity of the Millelith','HP%']
};
function show(ch){
 const id=slug(ch.id||ch.key||ch.name),name=ch.name||ch.id||'Тодорхойгүй';
 const vision=ch.vision||ch.element||'',weapon=ch.weapon||ch.weaponType||'';
 const nation=ch.nation||ch.region||'Тодорхойгүй';
 const el=elements[vision]||[vision||'Тодорхойгүй','✦'],build=builds[id]||[];
 const image=typeof ch.image==='string'?ch.image:(ch.images?.portrait||ch.image?.portrait||ch.images?.splash||ch.image?.splash||ch.images?.card||ch.image?.card||ch.img?.card||'');
 const story=ch.bio||ch.story||ch.lore||ch.background||'Дүрийн гарал үүсэл, гол үйл явдал болон холбоо хамаарлыг эх сурвалжтай судлан нэмнэ.';
 root.className='profile';
 root.innerHTML='<section class="hero"><div class="hero-caption">GENSHIN IMPACT · CHARACTER ARCHIVE</div><div class="hero-mark">'+esc(name.slice(0,1))+'</div>'+(image?'<img class="hero-art" src="'+esc(image)+'" alt="'+esc(name)+'" onerror="this.style.display=\'none\'">':'')+'</section>'+
 '<section class="profile-card"><div class="profile-head"><div><div class="kicker">CHARACTER DETAILS</div><h1>'+esc(name)+'</h1></div><div class="stars">'+(Number(ch.rarity)?'★'.repeat(Math.min(5,Number(ch.rarity))):'—')+'</div></div>'+
 '<div class="stats"><div><div class="stat-label">Элемент</div><div class="stat-value"><b>'+el[1]+'</b>'+esc(el[0])+'</div></div><div><div class="stat-label">Зэвсэг</div><div class="stat-value"><b>⚔</b>'+esc(weapons[weapon]||weapon||'Тодорхойгүй')+'</div></div><div><div class="stat-label">Үндэстэн</div><div class="stat-value"><b>⌖</b>'+esc(nation)+'</div></div><div><div class="stat-label">Үүрэг</div><div class="stat-value"><b>✧</b>'+esc(ch.role||ch.bestRole||roles[id]||'Судалгаагаар нэмнэ')+'</div></div></div></section>'+
 '<div class="content"><section class="content-section"><h2>Overview</h2><p>'+esc(ch.description||ch.title||'Дүрийн танилцуулгыг судалгаагаар нэмнэ.')+'</p></section>'+
 '<section class="content-section"><h2>Түүх ба гарал үүсэл</h2><p>'+esc(story)+'</p></section>'+
 '<section class="content-section"><h2>Best Build</h2><div class="build-grid"><div class="build-item"><div class="build-icon">⚔</div><div><strong>Зэвсэг</strong><small>'+esc(build[0]||'Судалгаагаар нэмнэ')+'</small></div></div><div class="build-item"><div class="build-icon">✧</div><div><strong>Артефакт</strong><small>'+esc(build[1]||'Судалгаагаар нэмнэ')+'</small></div></div></div><p class="note">'+(build[2]?'Гол үзүүлэлт: '+esc(build[2]):'Бусад build мэдээллийг баталгаатай эх сурвалжаар нэмнэ.')+'</p></section></div>';
 document.title=name+' — Games Lore MN';
}
if(!wanted){
 root.className='error';
 root.textContent='Дүрийн ID олдсонгүй. Дүрүүдийн сангаас дахин сонгоно уу.';
 return;
}
fetch('characters-auto.json',{cache:'no-cache'})
 .then(response=>{if(!response.ok) throw new Error('HTTP '+response.status);return response.json();})
 .then(data=>{
  const list=Array.isArray(data.characters)?data.characters:[];
  const ch=list.find(item=>slug(item.id||item.key||item.name)===wanted||slug(item.name)===wanted);
  if(!ch) throw new Error('Character not found');
  show(ch);
 })
 .catch(()=>{
  root.className='error';
  root.textContent='Дүрийн мэдээллийн санг ачаалж чадсангүй. Интернэтээ шалгаад дахин оролдоно уу.';
 });
})();
</script></body></html>
