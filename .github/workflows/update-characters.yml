name: Update Genshin Characters

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-genshin-characters
  cancel-in-progress: false

jobs:
  update-characters:
