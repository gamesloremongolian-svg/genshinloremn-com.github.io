name: Update Genshin Characters

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-genshin-characters
  cancel-in-progress: false

jobs:
  update-characters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch character database
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';

          const base = 'https://genshin.jmp.blue';

          async function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          async function getJson(url, attempts = 3) {
            let lastError;

            for (let i = 1; i <= attempts; i++) {
              try {
                const response = await fetch(url, {
                  headers: {
                    Accept: 'application/json',
                    'User-Agent': 'Genshin-Lore-Mongolian'
                  },
                  signal: AbortSignal.timeout(20000)
                });

                if (!response.ok) {
                  throw new Error(
                    `HTTP ${response.status} ${response.statusText}`
                  );
                }

                return await response.json();
              } catch (error) {
                lastError = error;
                console.log(`Attempt ${i}: ${error.message}`);

                if (i < attempts) await wait(2000 * i);
              }
            }

            throw lastError;
          }

          function normalize(id, c) {
            return {
              id,
              name: c.name || id,
              title: c.title || '',
              vision: c.vision || '',
              weapon: c.weapon || '',
              nation: c.nation || '',
              rarity: c.rarity || null,
              constellation: c.constellation || '',
              birthday: c.birthday || '',
              description: c.description || '',
              affiliation: c.affiliation || '',
              image: `${base}/characters/${encodeURIComponent(id)}/icon-big`
            };
          }

          // Өмнөх мэдээллийн санг хадгалж уншина.
          let previous = null;

          try {
            previous = JSON.parse(
              await fs.readFile('characters-auto.json', 'utf8')
            );
          } catch {
            console.log('No previous database found.');
          }

          let characters = [];

          // Эхлээд бүх дүрийн дэлгэрэнгүй мэдээллийг татахыг оролдоно.
          try {
            const data = await getJson(
              `${base}/characters/all?lang=en`
            );

            if (Array.isArray(data)) {
              characters = data.map((c, i) =>
                normalize(
                  c.id || c.name?.toLowerCase().replaceAll(' ', '-') || String(i),
                  c
                )
              );
            } else if (data && typeof data === 'object') {
              const entries = data.characters
                ? Object.entries(data.characters)
                : Object.entries(data);

              characters = entries
                .filter(([, c]) => c && typeof c === 'object')
                .map(([id, c]) => normalize(id, c));
            }

            console.log(`Bulk API: ${characters.length} characters`);
          } catch (error) {
            console.log(`Bulk API failed: ${error.message}`);
          }

          // Нөөц хувилбар: ID жагсаалтаар дүр бүрийг татна.
          if (!characters.length) {
            console.log('Using individual character requests...');

            const names = await getJson(`${base}/characters`);

            if (!Array.isArray(names)) {
              throw new Error('Character list response is not an array');
            }

            for (const id of names) {
              try {
                const c = await getJson(
                  `${base}/characters/${encodeURIComponent(id)}?lang=en`,
                  2
                );

                characters.push(normalize(id, c));
                await wait(150);
              } catch (error) {
                console.log(`Skipped ${id}: ${error.message}`);
              }
            }
          }

          if (!characters.length) {
            throw new Error('No character data received');
          }

          characters.sort((a, b) =>
            a.id.localeCompare(b.id)
          );

          // Өмнөх мэдээллийн сангаас хэт их буурсан эсэхийг шалгана.
          if (
            previous &&
            Number.isFinite(previous.count) &&
            previous.count > 0 &&
            characters.length < previous.count * 0.8
          ) {
            throw new Error(
              `Suspicious character drop: ${previous.count} -> ${characters.length}. Previous database preserved.`
            );
          }

          // Өөрчлөлт байгаа эсэхийг шалгана.
          const same = previous &&
            JSON.stringify(previous.characters) ===
            JSON.stringify(characters);

          const output = {
            updatedAt: same
              ? previous.updatedAt
              : new Date().toISOString(),
            count: characters.length,
            source: base,
            characters
          };

          await fs.writeFile(
            'characters-auto.json',
            JSON.stringify(output, null, 2) + '\n'
          );

          console.log(
            same
              ? `No changes. Kept previous update date.`
              : `Saved ${characters.length} characters.`
          );
          NODE

      - name: Validate database
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';

          const data = JSON.parse(
            await fs.readFile('characters-auto.json', 'utf8')
          );

          if (!Array.isArray(data.characters)) {
            throw new Error('Characters must be an array');
          }

          if (data.characters.length === 0) {
            throw new Error('Character database is empty');
          }

          if (data.count !== data.characters.length) {
            throw new Error(
              `Count mismatch: ${data.count} != ${data.characters.length}`
            );
          }

          console.log(`Validated ${data.count} characters.`);
          NODE

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add characters-auto.json

          if git diff --cached --quiet; then
            echo "No character data changes. No commit needed."
          else
            git commit -m "Update Genshin character database"
            git push
          fi
