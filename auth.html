<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101522">
<title>Genshin Lore Wiki — Нэвтрэх</title>
<style>
:root{color-scheme:dark;--bg:#101522;--panel:#1a2639;--gold:#e9bd68;--cyan:#75d9e8;--text:#f4f0e8;--muted:#aab3c4}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#263653,#101522 60%);color:var(--text);font-family:Arial,sans-serif;display:grid;place-items:center;padding:22px}
.card{width:min(100%,440px);padding:30px;border:1px solid #4a5260;border-radius:18px;background:rgba(26,38,57,.94);box-shadow:0 20px 60px #0006}
.brand{color:var(--gold);font-size:12px;letter-spacing:3px;font-weight:bold}.card h1{font-size:27px;margin:12px 0 6px}.sub{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 22px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}.tabs button{padding:12px;border-radius:9px;border:1px solid #46536a;background:#121c2d;color:var(--muted);font-weight:bold}.tabs button.active{background:var(--gold);color:#171b25;border-color:var(--gold)}
label{display:block;font-size:13px;margin:14px 0 7px}input{width:100%;padding:14px;border:1px solid #46536a;border-radius:9px;background:#111a29;color:white;font-size:15px}input:focus{outline:2px solid #75d9e888;border-color:var(--cyan)}
.google{width:100%;padding:13px;margin-top:14px;border:1px solid #64748b;border-radius:9px;background:#f8fafc;color:#1f2937;font-weight:bold;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px}.google:disabled{opacity:.6}.google-mark{font-weight:900;color:#4285f4;font-size:19px}.submit{width:100%;padding:14px;margin-top:20px;border:0;border-radius:9px;background:var(--gold);color:#171b25;font-weight:bold;font-size:15px}
#message{min-height:24px;margin:15px 0 0;color:var(--cyan);font-size:13px;line-height:1.5}.back{display:block;margin-top:20px;color:var(--gold);text-align:center;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<main class="card">
<div class="brand">GAMES LORE MN · PRIVATE WIKI</div>
<h1>Genshin Lore Wiki</h1>
<p class="sub">Wiki-ийн мэдээллийг уншихын тулд бүртгүүлэх эсвэл нэвтэрнэ үү.</p>
<div class="tabs">
<button type="button" id="loginTab" class="active">Нэвтрэх</button>
<a id="signupTab" href="signup.html" style="display:grid;place-items:center;padding:12px;border-radius:9px;border:1px solid #46536a;background:#121c2d;color:#f4f0e8;font-weight:bold;text-decoration:none">Бүртгүүлэх</a>
</div>
<form id="authForm">
<label for="email">И-мэйл хаяг</label>
<input id="email" type="email" autocomplete="email" placeholder="name@example.com" required>
<label for="password">Нууц үг</label>
<input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="Доод тал нь 6 тэмдэгт" required>
<button class="submit" id="submitBtn" type="submit">Нэвтрэх</button>
</form>
<button class="google" id="googleBtn" type="button"><span class="google-mark">G</span> Google-ээр үргэлжлүүлэх</button>
<p id="message" role="status"></p>
<a class="back" href="index.html">← Games Lore MN нүүр хуудас</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://zyocifqdpbgwlgwtrgnq.supabase.co";
const SUPABASE_KEY = "sb_publishable_-VovpqoGFuRIi5yle5SYMw_iwMDpETf";
const form=document.getElementById("authForm"), message=document.getElementById("message"), googleBtn=document.getElementById("googleBtn");
const loginTab=document.getElementById("loginTab"), submitBtn=document.getElementById("submitBtn");
let mode="login", client=null;
function setMode(next){
 mode=next;
 loginTab.classList.toggle("active",mode==="login");
 signupTab.classList.toggle("active",mode==="signup");
 submitBtn.textContent=mode==="login"?"Нэвтрэх":"Бүртгүүлэх";
 document.getElementById("password").autocomplete=mode==="login"?"current-password":"new-password";
 message.textContent=mode==="signup"?"Шинэ хэрэглэгчийн бүртгэл үүсгэнэ.":"Бүртгэлтэй бол нэвтэрнэ үү.";
}
loginTab.addEventListener("click",()=>setMode("login"));
signupTab.addEventListener("click",()=>setMode("signup"));
function initSupabase(){
 if(!window.supabase || typeof window.supabase.createClient!=="function"){
  message.textContent="Supabase сан ачаалагдсангүй. Хуудсыг дахин ачаална уу.";
  return false;
 }
 client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 return true;
}
(async()=>{
 if(!initSupabase()) return;
 try {const {data:{session}}=await client.auth.getSession();if(session)location.replace("wiki.html");}
 catch(err){message.textContent="Холболтын алдаа: "+(err.message||"Дахин оролдоно уу.");}
})();
googleBtn.addEventListener("click",async()=>{
 if(!client&&!initSupabase()) return;
 googleBtn.disabled=true;message.textContent="Google нэвтрэлтийг нээж байна…";
 try{
  const {error}=await client.auth.signInWithOAuth({provider:"google",options:{redirectTo:new URL("auth-callback.html",window.location.href).href}});
  if(error) message.textContent="Google нэвтрэлтийн алдаа: "+error.message;
 }catch(err){message.textContent="Алдаа: "+(err.message||"Дахин оролдоно уу.");}
 finally{googleBtn.disabled=false;}
});
form.addEventListener("submit",async e=>{
 e.preventDefault();
 if(!client&&!initSupabase()) return;
 submitBtn.disabled=true;submitBtn.textContent="Түр хүлээнэ үү…";message.textContent="";
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 try{
  const result=mode==="signup"
   ? await client.auth.signUp({email,password})
   : await client.auth.signInWithPassword({email,password});
  if(result.error) message.textContent=result.error.message;
  else if(mode==="signup"&&!result.data.session) message.textContent="Бүртгэл үүслээ. И-мэйлээ баталгаажуулаад нэвтэрнэ үү.";
  else {message.textContent="Амжилттай. Wiki руу шилжүүлж байна…";location.replace("wiki.html");}
 }catch(err){message.textContent="Алдаа: "+(err.message||"Интернэтээ шалгаад дахин оролдоно уу.");}
 finally{submitBtn.disabled=false;submitBtn.textContent=mode==="login"?"Нэвтрэх":"Бүртгүүлэх";}
});</script>
</body>
</html>
