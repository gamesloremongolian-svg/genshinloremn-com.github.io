<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101522">
<meta name="description" content="Games Lore MN Wiki нэвтрэх хуудас.">
<title>Wiki-д нэвтрэх — Games Lore MN</title>
<style>
:root{color-scheme:dark;--panel:#1a2639;--gold:#e9bd68;--cyan:#75d9e8;--text:#f4f0e8;--muted:#aab3c4;--line:#46536a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px;display:grid;place-items:center;background:radial-gradient(ellipse at top,#263653,#101522 60%);color:var(--text);font-family:Arial,sans-serif}
.card{width:min(100%,440px);padding:30px;border:1px solid #4a5260;border-radius:18px;background:rgba(26,38,57,.96);box-shadow:0 20px 60px #0006}
.brand{color:var(--gold);font-size:12px;letter-spacing:3px;font-weight:bold}
h1{font-size:27px;margin:12px 0 6px}
.sub{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 22px}
label{display:block;font-size:13px;margin:14px 0 7px}
input{width:100%;padding:14px;border:1px solid var(--line);border-radius:9px;background:#111a29;color:white;font-size:15px}
input:focus{outline:2px solid #75d9e888;border-color:var(--cyan)}
button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:9px;background:var(--gold);color:#171b25;font-weight:bold;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#message{min-height:24px;margin:15px 0 0;color:var(--cyan);font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.back{display:block;margin-top:20px;color:var(--gold);text-align:center;text-decoration:none;font-size:13px}
</style>
<link rel="stylesheet" href="assets/css/site-polish.css">
</head>
<body>
<main class="card">
<div class="brand">GAMES LORE MN · PRIVATE WIKI</div>
<h1>Wiki-д нэвтрэх</h1>
<p class="sub">Бүртгэлтэй и-мэйл хаяг болон нууц үгээ ашиглан нэвтэрнэ үү.</p>
<form id="authForm">
<label for="email">И-мэйл хаяг</label>
<input id="email" type="email" autocomplete="username" placeholder="name@example.com" required>
<label for="password">Нууц үг</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Нууц үгээ оруулна уу" required>
<button id="submitBtn" type="submit">Нэвтрэх</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
<a class="back" href="index.html">← Games Lore MN нүүр хуудас</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const SUPABASE_URL='https://zyocifqdpbgwlgwtrgnq.supabase.co';
const SUPABASE_KEY='sb_publishable_-VovpqoGFuRIi5yle5SYMw_iwMDpETf';
const form=document.getElementById('authForm');
const message=document.getElementById('message');
const submitBtn=document.getElementById('submitBtn');
let client=null;

function initSupabase(){
  if(!window.supabase||typeof window.supabase.createClient!=='function'){
    message.textContent='Supabase сан ачаалагдсангүй. Интернэт холболтоо шалгаад хуудсыг дахин ачаална уу.';
    return false;
  }
  client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  return true;
}

(async()=>{
  if(!initSupabase()) return;
  try{
    const {data,error}=await client.auth.getSession();
    if(error) throw error;
    if(data.session) window.location.replace('wiki-v2.html');
  }catch(error){
    message.textContent='Холболтын алдаа: '+(error.message||'Дахин оролдоно уу.');
  }
})();

form.addEventListener('submit',async(event)=>{
  event.preventDefault();
  if(!client&&!initSupabase()) return;
  submitBtn.disabled=true;
  submitBtn.textContent='Нэвтэрч байна…';
  message.textContent='';
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  try{
    const {data,error}=await client.auth.signInWithPassword({email,password});
    if(error) throw error;
    if(!data.session) throw new Error('Нэвтрэх session үүссэнгүй.');
    message.textContent='Амжилттай нэвтэрлээ. Wiki руу шилжүүлж байна…';
    window.location.replace('wiki-v2.html');
  }catch(error){
    message.textContent='Нэвтрэхэд алдаа гарлаа: '+(error.message||'И-мэйл болон нууц үгээ шалгана уу.');
  }finally{
    submitBtn.disabled=false;
    submitBtn.textContent='Нэвтрэх';
  }
});
</script>
</body>
</html>
